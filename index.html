    ]},
    {id:'sentinel',title:'哨兵與嚮導基礎',en:'SENTINEL & GUIDE FUNDAMENTALS',summary:'理解特殊感官、精神能力及定期精神疏導的必要性。',sections:[
      {title:'認識哨兵與嚮導',body:[
        '哨兵與嚮導是具有特殊感官或精神能力的人員。兩者的能力特徵與工作安排有所不同，但在實際勤務中經常需要相互合作；這不是單方向的保護或附屬關係。',
        '對即將加入塔的新進同仁而言，理解兩者的基本能力與需求，是日後進行人員支援、資料管理及工作協調的必要前提。'],visual:'abilities'},
      {title:'分化與法定入編',body:[
        '哨兵與嚮導的分化通常在青春期發生，也可能直到成年才出現，事前並沒有普遍可靠的徵兆。學校、醫療檢查或個人申報等情況，均可能成為發現及通報的途徑。',
        '經確認分化後，相關人員須依法進入塔接受編列、教育與訓練。人員通常在指定學校與宿舍生活，並依專業能力與實際需要分配前線、疏導或其他工作。',
        '塔內提供相應的工作待遇及生活安排；然而，任何專業工作都伴隨責任與限制。入編並不等於可自由選擇不受管理，也不表示所有人對此具有相同感受。']},
      {title:'哨兵：高度感知與環境適應',body:[
        '哨兵能比一般人更敏銳地察覺聲音、氣味、光線與其他環境刺激，因此在觀察、追蹤、偵察及特殊行動中具有相應優勢。透過訓練，哨兵能改善自身的感官控制與注意力分配。',
        '高度感知不代表無限制的承受能力。當外部資訊密集、精神負荷持續累積時，哨兵仍可能感到不適，並影響工作表現。',
        '哨兵通常有基本的精神防線，能抵禦部分精神干擾，但其強度與精細度通常不及專業嚮導。精神防線不應被理解為免疫一切精神影響。']},
      {title:'嚮導：精神能力與專業協作',body:[
        '嚮導通常具備較強的精神力量，能夠經由專業訓練運用精神能力協助哨兵維持穩定狀態。精神疏導是重要職能，但不是嚮導能力的全部。',
        '受過相應訓練的前線嚮導，也能參與特殊行動、協助團隊處理精神層面的需求，並具備戰鬥及自我保護的能力。',
        '在日常工作中，不應單憑「哨兵」或「嚮導」的身份，推定某位人員必然具備或缺乏某種職務資格。']},
      {title:'為何定期疏導不可省略',body:[
        '哨兵在運用高度敏銳的感官與精神能力的過程中，可能逐漸累積精神負荷。長期缺乏適當疏導，可能使精神狀態逐步失衡，影響感官控制與日常工作。',
        '定期精神疏導屬於哨兵長期工作需求的一部分，並不是能力不足、意志薄弱或訓練不佳的表現。即使是經驗豐富、具有高度自制力的哨兵，也無法完全以訓練取代疏導。',
        '塔藉由人員與資源協調，盡可能確保必要的疏導安排能持續進行。'],scenario:{label:'工作情境｜長期勤務',text:'某名前線哨兵因連續勤務而延後疏導，自認仍可正常工作。工作協調人員應尊重其經驗，同時依專業安排協調必要疏導，不應逕行認定「資深就不需要」。'}},
      {title:'疏導資源與專業人員保障',body:[
        '嚮導人數相對稀少，因此塔統籌安排主要精神疏導資源，並對嚮導提供相應的照顧、保護及工作支援。對哨兵而言，正式編列亦有助於穩定取得必要的專業協助。',
        '資源有限意味著排程、工作負荷與人員需求必須持續協調。尊重嚮導的專業判斷、身體狀況及休息需要，與確保疏導服務的持續性同樣重要。']},
      {title:'工作環境中的尊重與界線',body:[
        '精神狀態、疏導紀錄及個人健康需求，都屬於需要謹慎對待的資料。未經授權，不應要求他人展示能力、解釋私人疏導安排，或向無關人員公開敏感資訊。',
        '相互尊重、清楚分工及適度尋求專業協助，是塔內協作的基本原則。']}
    ]},
    {id:'mental',title:'精神系統與安全規範',en:'MENTAL SYSTEMS & SAFETY',summary:'理解精神觸手、疏導、精神圖景與完全結合的基本規則。',sections:[
      {title:'精神能力與工作安全',body:[
        '精神能力可能涉及感知、精神疏導、人員支援及其他專業任務。即使並非哨嚮專業人員，您仍應理解常見術語，並在工作中尊重相關安全界線。',
        '本課程旨在建立基礎認識，不授予任何精神能力操作資格，也不應取代專業訓練與實際評估。']},
      {title:'精神能力的基本分類',body:[
        '工作上常用的精神系統術語，包括精神接觸、精神觸手、精神疏導與精神圖景。各項操作的專業要求並不相同，也不應與一般行政權限混為一談。',
        '本單元僅提供已確認的基礎概念。具體能力表現、精神圖景相關操作條件及其他進階規則，仍應以正式專業教材與個別授權為準。'],visual:'mental'},
      {title:'精神觸手與一般疏導',body:[
        '嚮導可使用精神觸手或精神觸鬚，與目標建立精神層面的接觸，並在適當條件下進行精神疏導。一般疏導不必然需要肢體接觸。',
        '某些具有經驗的嚮導，可能配合肢體接觸提升疏導成效，但具體方式仍應考量個別人員的需求、意願及專業安排。',
        '一次普通疏導、精神接觸或短期互動，不會自動構成永久性精神關係。']},
      {title:'精神圖景與個人界線',body:[
        '精神圖景涉及個體深層精神領域，與當事人的精神狀態及內在經驗密切相關。進入他人精神圖景是高度敏感的精神接觸行為，並非一般行政工作。',
        '與精神圖景相關的操作應尊重當事人意願、必要的信任及正式專業程序；非相關人員不應自行安排或嘗試精神干預。']},
      {title:'完全結合的長期影響',body:[
        '完全結合會使兩人的精神圖景相互連結，形成難以分離的精神關係。這種關係以雙方建立的信任為基礎，並不存在以匹配分數決定伴侶的制度。',
        '結合後，嚮導對其他哨兵的疏導效果將大幅下降；其他嚮導對已結合哨兵仍可能提供有限幫助，但通常無法達到深入疏導的程度。',
        '若其中一方死亡，另一方可能遭受嚴重精神創傷及生命危險；雙方都在世時，精神圖景分離亦僅可能在雙方有強烈分離意願的情況下嘗試，手術成功率極低。',
        '塔對年輕人員的完全結合採取審慎管理態度；未經核准進行完全結合將面臨處分。相關個案應依正式程序處理，不應將一般疏導誤認為完全結合。']},
      {title:'疏導與連結並不相同',body:[
        '精神接觸是較廣泛的精神互動概念；精神疏導著重協助調整或穩定精神狀態；精神連結則涉及不同層次的精神關係。',
        '是否曾接受同一位嚮導的疏導，並不能用來推斷雙方已建立持續性的精神關係，更不能據此認定有永久伴侶關係。',
        '若工作現場有人員出現顯著精神不適，非專業人員應先維持現場安全、降低不必要刺激，並向適當人員尋求協助。'],scenario:{label:'工作情境｜查閱精神紀錄',text:'某位同仁要求您轉寄另一人的疏導詳細紀錄，並聲稱只是為了方便安排勤務。您應先確認實際工作需求及相應的資料授權，不應因私人請託而提供敏感資料。'}}
    ]},
    {id:'org',title:'塔內職能與協作',en:'ORGANISATIONAL FUNCTIONS',summary:'了解前線、精神疏導、行政支援與職務授權的關係。',sections:[
      {title:'跨職能協作',body:[
        '塔的工作跨越特殊行動、人員支援、行政協調及資訊管理等領域。因實際任務需求不同，人員的專業資格、工作內容與資料權限也會有所差異。',
        '以下分類是為便於共同培訓所採用的職能介紹，並不表示每一類都已被設定為獨立的正式行政部門。']},
      {title:'前線行動與特殊任務',body:[
        '經授權的前線人員依任務需求進行專業訓練及編組。哨兵擅長運用感官能力進行觀察、追蹤與環境辨識；具備相應資格的前線嚮導，亦可參與行動並提供精神支援。',
        '特別行動小隊的實際編成及任務資料由授權系統管理。一般新進人員不得自行調閱未經開放的行動紀錄。']},
      {title:'疏導與人員支援',body:[
        '嚮導的疏導工作是維持哨兵長期勤務能力的重要一環，涉及專業安排、人員協調及適當的紀錄管理。',
        '曾參與前線工作的嚮導，也可能因工作安排、身體狀態或其他專業需求，轉而承擔不同形式的支援職務。個別人員的工作資格，應以正式職務與專業安排為準。']},
      {title:'營區生活、休假與邊界',body:[
        '塔的營區提供人員居住、教育、訓練與工作的集中空間。完成必要申請及核准休假後，塔內人員可以在牆內回家、購物，或與親友正常往來。',
        '長途旅行或搬離管轄範圍，須另依規定提出申請。離開營區並不等於取得出牆許可；一般居民的邊界管理規定仍然適用。']},
      {title:'退役、安養及工作調整',body:[
        '哨兵約於六十歲可依制度退役，但退役後仍接受必要的編列追蹤與管理，並非完全解除與塔的關係。',
        '嚮導原則上持續由塔安置與管理。年老或無法繼續執行勤務時，可停止工作並於塔內接受安養，這並不等於必須終身服勤。',
        '與哨兵完全結合、關係穩定的嚮導，經多次檢查及評估確認符合條件後，有機會停止勤務並離塔生活。僅交往或登記婚姻不等於取得此資格。']},
      {title:'人員晶片的基本功能',body:[
        '納入塔管理的哨兵與嚮導，均配有用於確認身分、定位，以及身體與精神狀態監測的人員晶片。',
        '晶片資料亦屬應審慎處理的人員資訊。個別監測內容及操作權限，應依相應工作需求與正式程序管理。']},
      {title:'行政、文件與資訊',body:[
        '文件整理、資料歸檔、日程協調、內部通訊及其他日常行政業務，是維持組織運作的重要環節。此類工作不一定直接參與前線行動，但可能接觸敏感的勤務與人員資訊。',
        '準確、完整且可追溯的記錄，有助於避免工作延誤、職責混淆及不必要的安全風險。'],visual:'functions'},
      {title:'職務分配與權限管理',body:[
        '在正式取得職位通知前，您仍屬待分配人員。共同培訓的目的在於建立基礎知識，並非直接授予專業資格或特定部門權限。',
        '如其他單位提出資料需求，請確認對方身份、實際業務需要與授權程序後，再依規範辦理。'],scenario:{label:'工作情境｜跨單位資料請求',text:'一名自稱前線同仁的人員，要求您跳過程序提供某位哨兵的疏導紀錄。適當的做法，是先確認其身份與資料需求，而非因對方聲稱緊急就交出完整私人資料。'}}
    ]},
    {id:'safety',title:'特殊變異個體識別與公共安全',en:'OFFICIAL SAFETY GUIDANCE',summary:'學習政府與塔發布的「奇美拉」風險分類與安全通報程序。',official:true,sections:[
      {title:'公共安全是共同責任',body:[
        '維持社會穩定與公共安全，是政府及相關組織持續投入的重要工作。正確識別潛在風險、避免不當接觸，已成為所有工作人員都應理解的基本安全意識。',
        '您不需要具備特殊行動能力，也不需直接參與相關處置。但若在工作過程中接觸特殊個體相關資料，應依官方風險分類與正式通報原則辦理。']},
      {title:'認識「奇美拉」：官方分類',body:[
        '在現行官方安全資料中，「奇美拉」是對牆外特定異常變異個體的分類稱呼。相關個體可能具有異常肢體、附加器官及其他偏離一般人體型態的特徵。',
        '由於個體能力、活動狀態與潛在風險存在差異，未經專業評估前，不應以一般人員的安全標準自行判斷。',
        '請注意：外觀接近一般人，不代表排除了特殊風險；能夠交談，也不代表已可預測其行為；沒有立即表現攻擊性，更不應成為忽略安全程序的理由。'],visual:'safety'},
      {title:'為什麼必須提高警覺',body:[
        '特殊變異個體相關事件可能涉及非典型的身體能力、難以即時評估的活動風險，以及對現場秩序的干擾。缺乏完整資訊時，未受專業訓練的人員往往難以自行判斷事件的危險程度。',
        '面對尚未確認的個體，最安全的方式並非靠近、追蹤或自行建立聯繫，而是保持適當距離，優先確認自身及周圍人員的安全。',
        '您的審慎判斷與即時通報，是守護周圍人員的重要一環。']},
      {title:'常見觀念與安全提醒',body:[
        '「對方看起來很友善，因此一定安全」並不是可靠的風險評估。平靜的外在行為，不應成為取消安全程序的唯一依據。',
        '「只要外觀接近一般人，就沒有通報必要」同樣不正確。未經評估的特徵與活動狀態，應交由具備相應資格的人員判斷。',
        '「網路流傳的目擊故事可以取代官方安全資料」亦不適當。未經確認的資料可能缺乏必要背景，並含有錯誤或片面的分類描述。']},
      {title:'遇到疑似個體時的通報原則',body:[
        '若發現疑似特殊變異個體，請保持冷靜、避免接近，並優先確保自身與其他人員安全。不要自行追捕、圍堵或進行能力測試。',
        '請依照正式流程通報，並將後續識別與處置交由具備相應職責的人員執行。未經確認，不應對外散布相關影像、位置及個人資料。',
        '完成本單元不代表您取得特殊個體識別或處置資格。'],scenario:{label:'工作情境｜公共設施目擊通報',text:'您收到某名民眾的目擊通報，對方表示疑似個體尚未出現攻擊行為。依官方教材，仍應登記並交由相關單位評估，不自行追蹤，也不在網路公開其位置。'}},
      {title:'非官方資訊與日常責任',body:[
        '部分民間資訊來源可能使用與官方不同的名稱或敘述方式描述相關個體。這類資料未必經過完整核實，亦可能缺乏必要的公共安全背景。',
        '請優先依現行正式分類處理業務，對無法確認的資料採取適當核實及通報程序。即使不參與前線，正確的記錄與可靠的資訊處理，同樣有助於維持安全、穩定的工作環境。',
        '感謝您共同維護公共安全。']}
    ]},
    {id:'ethics',title:'工作倫理與資訊安全',en:'WORKPLACE CONDUCT & INFORMATION SECURITY',summary:'了解資料權限、可疑訊息、終端機安全與通報責任。',sections:[
      {title:'維持可信賴的工作環境',body:[
        '資訊安全與工作倫理是所有塔內人員的共同責任。無論從事行政、專業支援或前線相關工作，均可能接觸重要的業務資訊。',
        '妥善處理文件、尊重職務界線並正確記錄工作流程，能有效降低資訊錯誤及安全風險。']},
      {title:'最小必要存取原則',body:[
        '內部資料按內容敏感性與工作需要設有不同權限。員工僅應取得執行正式職務所需的資訊。',
        '文件在技術上可被搜尋或開啟，不代表使用者已取得閱覽、複製或傳送的授權。若需要額外資料，請循正式流程申請。']},
      {title:'工作終端機使用規範',body:[
        '工作終端機應用於正式業務及經授權的培訓活動。請勿執行不明程式、開啟來源不明的附件，或將內部資料儲存至未經授權的外部位置。',
        '離開工作位置時，應妥善保護工作介面及個人資料。跨單位交換資訊前，應再次確認對象與授權範圍。']},
      {title:'異常連線與來源不明的訊息',body:[

<script>

window.HIRAETH_WS = (()=>{
'use strict';
const D=window.HIRAETH_DESK_DATA;
const E=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const icons={inbox:'✉',docs:'▤',directory:'♙',calendar:'▦',profile:'▣',browser:'◎',settings:'⚙',external:'⌁'};
const names=Object.fromEntries([...D.apps,{id:'external',label:'外部資料'}].map(x=>[x.id,x.label]));
// 單主視窗：route 表示正在閱讀的頁面，history 保存返回路徑。
function initial(){return {route:null,history:[],motion:'open',mailSearch:'',docSearch:'',peopleSearch:'',docCategory:'全部',browserSite:'tower',browserTab:0};}
function routeFor(app,opts={}){const id=opts.doc||opts.mail||opts.person;return {app,view:id?'detail':(['inbox','docs','directory'].includes(app)?'index':'home'),id:id||null,tab:'profile'};}
function go(w,app,opts={},replace=false){
 if(!names[app])return;
 if(w.route&&!replace)w.history.push({...w.route});
 if(replace)w.history=[];
 w.route=routeFor(app,opts);w.motion=replace?'open':'forward';
 if(opts.site){w.browserSite=opts.site;w.browserTab=0;}
}
function open(w,id,opts={}){go(w,id,opts,true);}
function focus(w,id){if(w.route&&w.route.app===id)return;}
function close(w){w.route=null;w.history=[];w.motion='close';}
function back(w){if(w.history.length){w.route=w.history.pop();w.motion='back';}else close(w);}
function descend(w,detail){if(w.route)w.history.push({...w.route});w.route={...w.route,view:'detail',id:detail,tab:'profile'};w.motion='forward';}
function label(id){return names[id]||id;}
function button(text,attrs='',cls=''){return `<button type="button" class="ws-button ${cls}" ${attrs}>${text}</button>`;}
function pills(items,selected,attr){return items.map(x=>button(E(x),`data-ws-${attr}="${E(x)}"`,x===selected?'selected':'')).join('')}
function link(item){return button(`↗ ${E(item.label)}`,`data-ws-link="${E(item.app)}" ${item.id?'data-link-id="'+E(item.id)+'"':''}`,'link-button')}

 return `<div class="ws-pane-title"><div><small>INTERNAL MAIL SYSTEM</small><h2>內部郵件 <span class="ws-count">${unread} 未讀</span></h2></div><span class="ws-soft-label">PERSONNEL NETWORK</span></div><div class="ws-split"><aside class="ws-list-area"><label class="ws-search"><span>⌕</span><input data-ws-search="mail" type="search" placeholder="搜尋信件或寄件人" value="${E(w.mailSearch)}"></label><div class="ws-list-caption">收件匣 · ${D.mails.length} 封</div>${list.map(m=>`<button class="ws-list-item ${w.selectedMail===m.id?'selected':''}" data-ws-mail="${E(m.id)}"><span class="ws-dot ${!(s.wsReadMails||[]).includes(m.id)?'unread':''}"></span><span><b>${E(m.subject)}</b><small>${E(m.sender)} · ${E(m.tag)}</small></span></button>`).join('')||'<p class="ws-empty">沒有符合搜尋的信件。</p>'}</aside><article class="ws-reader"><p class="ws-kicker">MESSAGE / ${E(selected.tag)}</p><h3>${E(selected.subject)}</h3><dl class="ws-meta"><dt>寄件者</dt><dd>${E(selected.sender)}</dd><dt>收件者</dt><dd>${E(s.employee)}</dd></dl>${selected.body.map(p=>`<p>${E(p).replace(/\n/g,'<br>')}</p>`).join('')}<div class="ws-related">${selected.link?link(selected.link):''}</div></article></div>`;

 return `${sectionHead('INTERNAL MAIL SYSTEM','內部郵件','INBOX / PERSONNEL NETWORK')}<div class="ws-index-intro"><span>✉　收件匣</span><span>${unread} 封未讀 · ${D.mails.length} 封郵件</span></div><label class="ws-search ws-search-wide"><span>⌕</span><input type="search" data-ws-search="mail" placeholder="搜尋信件、寄件人或分類" value="${E(w.mailSearch)}"></label><div class="ws-nav-list">${filtered.map(m=>listCard(m.subject,`${m.sender} · ${m.tag}`,`data-ws-mail="${E(m.id)}"`,(s.wsReadMails||[]).includes(m.id)?'✉':'✦',(s.wsReadMails||[]).includes(m.id)?'':'<i class="ws-unread-badge">未讀</i>')).join('')||'<p class="ws-empty">找不到符合條件的郵件。</p>'}</div>`;

function mailDetail(s,w){const m=D.mails.find(x=>x.id===w.route.id)||D.mails[0];return `${sectionHead('MAIL / '+m.tag,'內部郵件','PERSONNEL NETWORK')}<article class="ws-page-reader"><p class="ws-kicker">INTERNAL CORRESPONDENCE</p><h3>${E(m.subject)}</h3><dl class="ws-meta"><dt>寄件者</dt><dd>${E(m.sender)}</dd><dt>收件者</dt><dd>${E(s.employee)}</dd></dl><div class="ws-letter">${m.body.map(x=>`<p>${E(x).replace(/\n/g,'<br>')}</p>`).join('')}</div>${m.link?`<div class="ws-related"><h4>附件與關聯資料</h4>${link(m.link)}</div>`:''}</article>`;}

function docsDetail(s,w){const d=D.docs.find(x=>x.id===w.route.id)||D.docs[0];return `${sectionHead('DOCUMENT EXPLORER','工作文件','GENERAL ACCESS')}<article class="ws-page-reader ws-document"><p class="ws-kicker">${E(d.code)} / ${E(d.security)}</p><h3>${E(d.title)}</h3><div class="ws-document-stamp">THE TOWER · INTERNAL RECORD</div>${d.sections.map(([h,t])=>`<section class="ws-docsection"><h4>${E(h)}</h4><p>${E(t)}</p></section>`).join('')}<div class="ws-related"><h4>關聯資料</h4>${(d.related||[]).map(link).join('')||'<span>無其他公開關聯資料</span>'}</div></article>`;}
function peopleIndex(s,w){const filtered=D.people.filter(p=>`${p.name} ${p.roman} ${p.type} ${p.assignment}`.toLowerCase().includes(w.peopleSearch.toLowerCase()));return `${sectionHead('PERSONNEL DIRECTORY','人員名錄',E(s.employee)+' · GENERAL ACCESS')}<div class="ws-index-intro"><span>內部人員索引</span><span>${filtered.length} 位人員</span></div><label class="ws-search ws-search-wide"><span>⌕</span><input type="search" data-ws-search="people" placeholder="搜尋人員姓名、類別或編組" value="${E(w.peopleSearch)}"></label><div class="ws-person-grid">${filtered.map(p=>`<button type="button" class="ws-person-card" data-ws-person="${E(p.id)}"><span class="ws-person-card-portrait">${p.image?`<img src="${E(p.image)}" alt="${E(p.name)} 立繪">`:'♙'}</span><span class="ws-person-card-text"><strong>${E(p.name)}</strong><small>${E(p.roman)}</small><em>${E(p.type)}</em></span><span class="ws-nav-card-arrow">→</span></button>`).join('')||'<p class="ws-empty">沒有符合條件的人員。</p>'}</div>`;}
function peopleDetail(s,w){const p=D.people.find(x=>x.id===w.route.id)||D.people[0];const tab=w.route.tab||'profile';const detail=tab==='profile'?`<h4>人員概要</h4><p>${E(p.summary)}</p><div class="ws-facts"><span>人員類別</span><b>${E(p.type)}</b><span>工作職能</span><b>${E(p.function)}</b><span>關聯編組</span><b>${E(p.assignment)}</b></div>`:tab==='history'?`<h4>專業履歷</h4><p>${E(p.history)}</p><p class="ws-hint">正式職級及完整勤務紀錄須依實際授權查閱。</p>`:tab==='links'?`<h4>關聯文件</h4>${p.docs.map(id=>{const d=D.docs.find(x=>x.id===id);return d?listCard(d.title,d.code,`data-ws-link="docs" data-link-id="${E(d.id)}"`):''}).join('')}`:`<div class="ws-restricted"><div>◇　ACCESS RESTRICTED</div><h4>存取權限不足</h4><p>個人醫療、精神狀態、疏導細節及私人關係不屬於一般名錄的開放資料。</p><small>GENERAL ACCESS / NO DATA RETURNED</small></div>`;
 return `${sectionHead('PERSONNEL DIRECTORY','人員名錄',E(s.employee)+' · GENERAL ACCESS')}<article class="ws-page-reader ws-person-page"><div class="ws-identity"><div class="ws-portrait">${p.image?`<img alt="${E(p.name)} 立繪" src="${E(p.image)}">`:'<div class="ws-silhouette">♙<small>IMAGE PENDING</small></div>'}</div><div><p class="ws-kicker">PERSONNEL / ${E(p.roman)}</p><h3>${E(p.name)}</h3><p class="ws-muted">${E(p.type)}</p><p class="ws-mini">正式工號及職級：待確認</p></div></div><div class="ws-tabs">${[['profile','基本資料'],['history','專業履歷'],['links','關聯文件'],['restricted','受限資料']].map(([k,n])=>button(n,`data-ws-tab="${k}"`,tab===k?'selected':'')).join('')}</div><div class="ws-persondetail">${detail}</div></article>`;}
function pageContent(s,w,C){const r=w.route;if(!r)return '';if(r.app==='inbox')return r.view==='detail'?mailDetail(s,w):mailIndex(s,w);if(r.app==='docs')return r.view==='detail'?docsDetail(s,w):docsIndex(s,w);if(r.app==='directory')return r.view==='detail'?peopleDetail(s,w):peopleIndex(s,w);return r.app==='profile'?profileContent(s):r.app==='calendar'?calendarContent():r.app==='browser'?browserContent(w,C):r.app==='settings'?settingsContent(s):externalContent(s,C);}
function routeTitle(r){if(!r)return '工作桌面';if(r.view==='detail'){if(r.app==='inbox')return D.mails.find(m=>m.id===r.id)?.subject||'郵件';if(r.app==='docs')return D.docs.find(d=>d.id===r.id)?.title||'文件';if(r.app==='directory')return D.people.find(p=>p.id===r.id)?.name||'人員';}return label(r.app);}
function windowHtml(s,w,C){const r=w.route;if(!r)return '';const previous=w.history.at(-1);const sourceName=previous?routeTitle(previous):'工作桌面';const currentTitle=routeTitle(r);const trail=['工作桌面',...w.history.map(routeTitle),currentTitle];return `<div class="ws-window-scrim ${w.motion==='open'?'ws-entering':''}" aria-hidden="true"></div><section class="ws-window ws-single-window ${w.motion==='open'?'ws-entering':''} ${r.app==='external'?'ws-external':''} ${w.history.length?'ws-has-history':''}" data-ws-window="${E(r.app)}" role="dialog" aria-label="${E(currentTitle)}" aria-modal="true"><header class="ws-windowhead"><div class="ws-nav-header"><button type="button" class="ws-back" data-ws-action="back" aria-label="返回${E(sourceName)}"><span aria-hidden="true">←</span><b>${w.history.length?'返回':'返回桌面'}</b></button><div class="ws-title-stack"><strong>${icons[r.app]}　${E(label(r.app))}</strong><small>${trail.map(E).join('　/　')}</small></div></div><button type="button" class="ws-close" data-ws-action="close" aria-label="關閉視窗，返回工作桌面">×</button></header><div class="ws-windowbody ws-motion-${E(w.motion)}" data-ws-page="${E(r.app)}-${E(r.view)}">${pageContent(s,w,C)}</div></section>`;}
function render(s,w,C){const unread=D.mails.filter(m=>!(s.wsReadMails||[]).includes(m.id)).length;return `<main class="desktop ws-desktop ${s.wsReduceMotion?'ws-reduced':''}"><div class="desktopwall"><p>THE TOWER</p><h1>第一個工作日。</h1><span>PERSONNEL NETWORK · WORKSTATION</span></div><div class="ws-desktop-icons">${D.apps.map(a=>`<button type="button" class="ws-desktop-icon" data-window="${E(a.id)}"><span class="ws-big-icon">${a.icon}</span><span>${E(a.label)}</span>${a.id==='inbox'&&unread?`<i>${unread}</i>`:''}</button>`).join('')}${s.breach?`<button type="button" class="ws-desktop-icon ws-foreign-icon" data-window="external"><span class="ws-big-icon">⌁</span><span>外部資料</span></button>`:''}</div><div class="ws-window-layer ${w.route?'ws-has-window':''}">${w.route?windowHtml(s,w,C):''}</div><div class="ws-taskbar"><div class="ws-taskbar-brand">✦　${E(s.employee)} <span>THE TOWER</span></div><div class="ws-task-apps">${w.route?`<button type="button" class="ws-taskbutton on" data-ws-action="task" aria-label="返回${E(label(w.route.app))}"><span>${icons[w.route.app]}</span><b>${E(label(w.route.app))}</b></button>`:'<span class="ws-taskbar-hint">選取桌面圖示以開啟應用程式</span>'}</div><div class="ws-taskbar-right"><span class="ws-connection"></span> 內部網路已連線</div></div></main>`;}
function click(el,s,w,C,store,rerender){const ds=el.dataset;let updated=false;const r=w.route;
 if(ds.wsAction){if(ds.wsAction==='back')back(w);else if(ds.wsAction==='close'||ds.wsAction==='min')close(w);else if(ds.wsAction==='task')w.motion='none';updated=true;}
 else if(ds.wsMail&&r){descend(w,ds.wsMail);s.wsReadMails=[...new Set([...(s.wsReadMails||[]),ds.wsMail])];updated=true;}
 else if(ds.wsDoc&&r){descend(w,ds.wsDoc);s.wsReadDocs=[...new Set([...(s.wsReadDocs||[]),ds.wsDoc])];updated=true;}
 else if(ds.wsPerson&&r){descend(w,ds.wsPerson);updated=true;}
 else if(ds.wsTab&&r){r.tab=ds.wsTab;w.motion='tab';updated=true;}
 else if(ds.wsCategory){w.docCategory=ds.wsCategory;w.motion='none';updated=true;}
 else if(ds.wsSite){w.browserSite=ds.wsSite;w.browserTab=0;w.motion='tab';updated=true;}
 else if(ds.wsSiteTab!==undefined){w.browserTab=Number(ds.wsSiteTab);w.motion='tab';updated=true;}
 else if(ds.wsLeak!==undefined){s.leakIndex=Number(ds.wsLeak);w.motion='tab';updated=true;}
 else if(ds.wsLink){const app=ds.wsLink,target=ds.linkId;go(w,app,{mail:app==='inbox'?target:undefined,doc:app==='docs'?target:undefined,person:app==='directory'?target:undefined,site:app==='browser'?target:undefined});if(app==='docs'&&target)s.wsReadDocs=[...new Set([...(s.wsReadDocs||[]),target])];if(app==='inbox'&&target)s.wsReadMails=[...new Set([...(s.wsReadMails||[]),target])];updated=true;}
 else if(ds.wsClearRead){s.wsReadMails=[];s.wsReadDocs=[];w.motion='none';updated=true;}
 if(updated){store();rerender();return true;}return false;
}
function startDrag(){return true;}
return {initial,open,focus,close,back,render,click,startDrag};
})();

const C=window.HIRAETH_CONTENT, ROOT=document.getElementById('app'), KEY='hiraeth-tower-v24-preview', LEGACY_KEY='hiraeth-tower-v22', W=window.HIRAETH_WS;
const fresh=()=>({employee:'Q008',name:'',phase:'login',initialTerms:false,completed:[],module:0,page:0,ack:false,visited:{},tourStep:0,answers:{},examPassed:false,examScore:null,ndaRead:false,ndaAgree:false,ndaSigned:false,breach:false,leakIndex:0,demoMode:false,wsReadMails:[],wsReadDocs:[],wsReduceMotion:false});
let s;try{s={...fresh(),...JSON.parse(localStorage.getItem(KEY)||localStorage.getItem(LEGACY_KEY)||'{}')}}catch{s=fresh()};
if(!Array.isArray(s.completed))s.completed=[]; if(!s.visited||typeof s.visited!=='object')s.visited={};if(!s.answers||typeof s.answers!=='object')s.answers={};
let portal=null,portalPage=0,win=null,ws=W.initial(),hackOpen=s.phase==='desktop'&&!s.breach;
const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const store=()=>{try{localStorage.setItem(KEY,JSON.stringify(s))}catch{}};
const set=(o,scroll=true)=>{Object.assign(s,o);store();render();if(scroll)window.scrollTo(0,0)};
const btn=(label,action,kind='primary',disabled=false)=>`<button type="button" class="btn ${kind}" data-action="${action}" ${disabled?'disabled':''}>${label}</button>`;
const all=()=>C.modules.every(m=>s.completed.includes(m.id));
const stepLabel={login:'員工登入',terms:'初次條款',training:'新人導覽',tour:'系統操作教學',quiz:'綜合測驗',finalnda:'最終保密協議',checklist:'入職確認',ready:'培訓完成',desktop:'工作桌面'};
const header=()=>`<header class="topbar"><div class="brand"><span class="brandglyph">✦</span><span><b>${esc(C.brand.name)}</b><small>${esc(C.brand.department)}</small></span></div><div class="sysinfo"><span class="online"></span> INTRANET <span class="sep">/</span> ${esc(stepLabel[s.phase]||'SYSTEM')} <span class="sep">·</span> ${esc(s.employee)}</div></header>`;
const footer=()=>`<footer class="footer"><span>${esc(C.brand.version)}</span><span>${esc(C.brand.notice)}</span><button type="button" class="resetlink" data-action="reset">↺ 重置體驗</button></footer>`;
const paper=(html,cls='')=>`<section class="paper ${cls}">${html}</section>`;
const breadcrumbs=title=>`<div class="breadcrumbs">THE TOWER <span>/</span> PERSONNEL <span>/</span> ${title}</div>`;
const readIcon=(pass)=>`<span class="checkmark ${pass?'yes':''}">${pass?'✓':'—'}</span>`;
function login(){return `<main class="centerstage"><div class="login-sigil">✧</div><p class="eyebrow">PERSONNEL ACCESS / FIRST DAY</p><h1>員工登入</h1><p class="muted">歡迎來到您第一天的工作環境。請使用員工識別碼登入。</p>${paper(`<div class="formfield"><label for="employee">員工工號 <small>EMPLOYEE ID</small></label><input id="employee" maxlength="20" spellcheck="false" autocomplete="off" placeholder="Q008" value="${esc(s.employee)}"><span class="hint">預設 Q008，亦可輸入 2–20 位英數字或連字號。</span></div><div class="formfield"><label for="nickname">顯示稱呼 <small>選填</small></label><input id="nickname" maxlength="30" placeholder="新進同仁" value="${esc(s.name)}"></div><div id="login-error" class="error" role="status"></div>${btn('登入工作終端 →','login')}${btn('快速預覽 V2.4.2 工作桌面 ↗','preview-work','secondary')}<p class="hint">快速預覽僅供功能測試，會跳過培訓和劇情觸發。完整故事請選擇「登入工作終端」。</p>`,'authpaper')}<p class="disclaimer">模擬入職體驗 · 不需要真實帳戶或密碼</p></main>`}
function terms(){return `<main class="document-stage">${breadcrumbs('FIRST ACCESS')}${paper(`<div class="document-head"><div><p class="eyebrow">SYSTEM ACCESS / HR-001</p><h1>內部資訊使用與保密須知</h1><p class="muted">初次登入確認 · 員工 ${esc(s.employee)}</p></div><span class="stamp">HR / 001</span></div><p class="document-intro">親愛的新進同仁：歡迎加入塔。開始培訓前，請先了解本工作系統的基本資料存取與通訊安全要求。</p>${C.firstTerms.map((a,i)=>`<section class="clause"><h3>0${i+1}　${esc(a[0])}</h3><p>${esc(a[1])}</p></section>`).join('')}<label class="checkline"><input type="checkbox" id="initial-agree" ${s.initialTerms?'checked':''}><span>我已閱讀上述須知，並理解本工作系統的基本使用要求。</span></label><div class="actions">${btn('返回登入','back-login','secondary')}${btn('確認並進入新人導覽 →','accept-terms','primary',!s.initialTerms)}</div>`,'document')}</main>`}
function sidebar(){return `<aside class="sidebar"><p class="eyebrow">EMPLOYEE ORIENTATION</p><h2>入職導覽</h2><div class="meta">員工 ${esc(s.employee)} · 職務待分配</div><div class="progress"><div class="progress-meta"><span>共同課程</span><span>${s.completed.length} / ${C.modules.length}</span></div><div class="track"><div class="fill" style="width:${s.completed.length/C.modules.length*100}%"></div></div></div><nav class="module-nav" aria-label="培訓課程">${C.modules.map((m,i)=>{let unlock=i===0||s.completed.includes(C.modules[i-1].id),done=s.completed.includes(m.id),active=i===s.module;return `<button class="nav-item ${active?'active':''}" data-module="${i}" ${unlock?'':'disabled'}><span class="nav-number">${done?'✓':String(i+1).padStart(2,'0')}</span><span>${esc(m.title)}</span>${!unlock?'<span class="lock">⌑</span>':''}</button>`}).join('')}</nav><p class="sidebar-note">請依序完成所有教材。綜合測驗將在最後統一開放。</p></aside>`}
function progressbar(i,len){return `<div class="section-progress"><span>SECTION ${String(i+1).padStart(2,'0')} / ${String(len).padStart(2,'0')}</span><div class="track"><div class="fill" style="width:${(i+1)/len*100}%"></div></div></div>`}
function portalVisual(){return `<div class="portal-grid"><button class="portal-card" data-portal="government"><span class="portal-symbol">▤</span><b>政府</b><small>GOVERNMENT PORTAL</small><em>${s.visited.government?'✓ 已瀏覽':'開啟官方網站 ↗'}</em></button><button class="portal-card" data-portal="tower"><span class="portal-symbol">✦</span><b>塔</b><small>THE TOWER PORTAL</small><em>${s.visited.tower?'✓ 已瀏覽':'開啟官方網站 ↗'}</em></button></div><p class="help-note">請開啟兩個官方入口。它們是作品世界中的模擬網站，不會導向現實網站。</p>`}
function visual(kind){if(kind==='portals')return portalVisual();if(kind==='abilities')return `<div class="diagram cards2"><div><strong>SENTINEL / 哨兵</strong><span>敏銳感官 · 感官控制訓練 · 定期疏導</span></div><div><strong>GUIDE / 嚮導</strong><span>較強精神力 · 精神疏導 · 前線專業能力</span></div></div>`;
if(kind==='mental')return `<div class="diagram cards2"><div><strong>精神連結</strong><span>不同層次的精神關係 · 不等同普通疏導</span></div><div><strong>精神圖景</strong><span>深層且敏感的個人精神領域</span></div><div><strong>精神觸手</strong><span>精神接觸與疏導的媒介</span></div><div><strong>精神疏導</strong><span>協助維持精神狀態的專業操作</span></div></div>`;
if(kind==='functions')return `<div class="diagram cards3"><div><strong>前線行動</strong><span>任務與小隊協作</span></div><div><strong>專業支援</strong><span>嚮導資源及疏導安排</span></div><div><strong>行政資訊</strong><span>文件、協調、日常業務</span></div></div>`;
if(kind==='safety')return `<div class="diagram cards3 safety-visual"><div><strong>01 · 識別</strong><span>留意異常特徵</span></div><div><strong>02 · 防範</strong><span>保持安全距離</span></div><div><strong>03 · 通報</strong><span>移交專業單位</span></div></div><p class="official-note">官方安全教材：本章反映塔的公開分類與宣傳立場。</p>`;
if(kind==='security')return `<div class="diagram cards3"><div><strong>來源核實</strong><span>確認訊息及附件</span></div><div><strong>權限檢查</strong><span>僅存取必要資訊</span></div><div><strong>異常通報</strong><span>保護工作終端機</span></div></div>`;return ''}
function modulePage(){let m=C.modules[s.module];if(m.id==='workstation')return tour();let page=Math.min(s.page,m.sections.length-1),sec=m.sections[page],last=page===m.sections.length-1,done=s.completed.includes(m.id),visitsOK=m.id!=='welcome'||(s.visited.government&&s.visited.tower);
return paper(`<div class="module-header"><p class="eyebrow">MODULE ${String(s.module+1).padStart(2,'0')} / ${esc(m.en)}</p><div class="module-title-row"><h2>${esc(m.title)}</h2><span class="status-tag ${done?'done':''}">${done?'✓ 已完成':'進行中'}</span></div><p class="lead">${esc(m.summary)}</p></div>${progressbar(page,m.sections.length)}<article class="lesson-page"><h3>${esc(sec.title)}</h3>${sec.body.map(p=>`<p>${esc(p)}</p>`).join('')}${sec.visual?visual(sec.visual):''}${sec.scenario?`<aside class="scenario"><b>${esc(sec.scenario.label)}</b><p>${esc(sec.scenario.text)}</p></aside>`:''}</article>${last&&!done?`<div class="lesson-confirm"><label class="checkline"><input id="ack" type="checkbox" ${s.ack?'checked':''}><span>我已完整閱讀本單元的教材與工作情境。</span></label>${!visitsOK?'<p class="help-note">請先在第三節開啟「政府」與「塔」的官方網站，完成機構導覽。</p>':''}</div>`:''}<div class="actions"><span class="muted small">課程 ${s.module+1} / ${C.modules.length} · 無需逐章測驗</span><div class="action-right">${btn('上一節','prev-page','secondary',s.page===0)}${last?btn(done?'前往下一單元 →':s.module===C.modules.length-2?'開始桌面教學 →':'完成本單元 →','finish-module','primary',!done&&(!s.ack||!visitsOK)):btn('下一節 →','next-page')}</div></div>`,'training-paper')}
function training(){return `<main class="workspace">${sidebar()}<section class="contentpane"><div class="panehead"><div><p class="eyebrow">OFFICIAL EMPLOYEE TRAINING</p><h1>第一工作日</h1><p class="muted">您好，${esc(s.name||s.employee)}。請完成新人必修導覽。</p></div><span class="status-tag">職務待分配</span></div>${modulePage()}</section></main>`}
function portalUI(){if(!portal)return '';let d=C.portals[portal],p=d.pages[portalPage]||d.pages[0],gov=portal==='government';return `<div class="portal-overlay"><section class="browser ${gov?'gov':'tower-portal'}" role="dialog" aria-modal="true" aria-label="${esc(d.name)}"><div class="browserbar"><span class="browser-controls">● ● ●</span><span>🔒　intranet://official/${portal}/${portalPage===0?'home':portalPage===1?'about':'notice'}</span><button data-action="close-portal" aria-label="關閉官方網站">×</button></div><div class="browser-page"><header class="portal-head"><span class="portal-emblem">${gov?'▤':'✦'}</span><div><small>${esc(d.eyebrow)}</small><h2>${esc(d.name)}</h2></div></header><div class="portal-hero"><span>OFFICIAL INFORMATION SERVICE</span><h3>${esc(d.tagline)}</h3></div><nav class="portal-tabs">${d.pages.map((x,i)=>`<button class="${portalPage===i?'selected':''}" data-portal-page="${i}">${esc(x.title)}</button>`).join('')}</nav><article class="portal-article"><p class="eyebrow">${gov?'PUBLIC ADMINISTRATION':'PERSONNEL & OPERATIONS'}</p><h3>${esc(p.heading)}</h3><p>${esc(p.text)}</p></article><footer class="portal-foot">官方公開資訊導覽 · HIRAETH 虛構世界之網站模擬　${btn('返回入職教材 →','close-portal','secondary')}</footer></div></section></div>`}
function desktopCanvas(isTour){const apps=C.tour;return `<div class="desktop-icons ${isTour?'tour-icons':''}">${apps.map((a,i)=>`<button type="button" class="desktop-icon ${isTour&&s.tourStep===i?'spotlight':''} ${isTour&&s.tourStep!==i?'dimmed':''}" data-window="${a.app}" ${isTour?'data-tour-icon="'+i+'"':''}><span class="appglyph">${esc(a.icon)}</span><span>${esc(a.title)}</span>${isTour&&s.tourStep===i?'<small>STEP '+(i+1)+'</small>':''}</button>`).join('')}${!isTour&&s.breach?'<button type="button" class="desktop-icon foreign" data-window="external"><span class="appglyph">⌁</span><span>外部資料</span></button>':''}</div>`}
function tour(){let t=C.tour[s.tourStep]||C.tour[0];return `<main class="tourstage"><div class="tourtop"><div><p class="eyebrow">MODULE 07 / WORKSTATION TOUR</p><h1>工作桌面操作導覽</h1><p>請依系統提示依序認識五項功能。這是安全的模擬教學環境。</p></div><span class="status-tag">TRAINING MODE</span></div><div class="desktop tour-desktop"><div class="desktopwall"><p>THE TOWER</p><h2>第一個工作日。</h2></div>${desktopCanvas(true)}<div class="taskbar"><span>✦　${esc(s.employee)} / 模擬工作桌面</span><span>TRAINING MODE · ${s.tourStep+1}/5</span></div><div class="tour-popover" role="status"><div class="tourhead"><span>GUIDED WALKTHROUGH</span><strong>${String(s.tourStep+1).padStart(2,'0')} / 05</strong></div><h3>${esc(t.headline)}</h3><p>${esc(t.detail)}</p><div class="tour-preview">${esc(t.preview.replace('Q008',s.employee))}</div><div class="actions">${btn('上一步','tour-back','secondary',s.tourStep===0)}${btn(s.tourStep===4?'完成導覽並前往測驗 →':'下一步 →','tour-next')}</div></div></div><p class="tour-bottom">目前受框選的圖示是本步驟的介紹對象。正式工作桌面將在所有培訓程序結束後開放。</p></main>`}
function quiz(){let count=Object.keys(s.answers).filter(k=>s.answers[k]!==undefined).length,passed=s.examPassed;return `<main class="document-stage quiz-stage">${breadcrumbs('FINAL KNOWLEDGE CHECK')}${paper(`<div class="document-head"><div><p class="eyebrow">FINAL ASSESSMENT · ORIENTATION</p><h1>綜合入職測驗</h1><p class="muted">所有課程已完成。請依據官方教材回答下列 10 題單選題。</p></div><span class="stamp">${passed?'PASS':'TEST / 10'}</span></div><div class="assessment-summary"><span>已作答 <b id="answer-count">${count}</b> / 10 題</span><span>通過標準：8 / 10</span><span>可重新作答</span></div>${s.examScore!==null?`<div class="score ${passed?'pass':'fail'}"><strong>${passed?'✓ 測驗通過':'測驗未通過'} · ${s.examScore} / 10</strong><span>${passed?'恭喜！您可以繼續完成最終保密協議。':'請查看答題回饋後重新作答。'}</span></div>`:''}<div class="questions">${C.questions.map((q,i)=>`<section class="question"><span class="question-index">QUESTION ${String(i+1).padStart(2,'0')}</span><h3>${esc(q.q)}</h3>${q.a.map((a,j)=>`<label class="choice"><input type="radio" name="q${i}" value="${j}" ${s.answers[i]===j?'checked':''} ${passed?'disabled':''}><span>${String.fromCharCode(65+j)}. ${esc(a)}</span></label>`).join('')}${s.examScore!==null?`<p class="answer-feedback ${s.answers[i]===q.correct?'correct':'wrong'}">${s.answers[i]===q.correct?'✓ 正確':'建議複習'}：${esc(q.why)}</p>`:''}</section>`).join('')}</div><div class="actions">${btn('返回複習課程','return-training','secondary')}${passed?btn('閱讀最終保密協議 →','to-final-nda'):s.examScore!==null?btn('重新作答','retry-quiz'):btn('提交綜合測驗','submit-quiz','primary',count<10)}</div>`,'document')}</main>`}
function finalNda(){return `<main class="document-stage">${breadcrumbs('FINAL CONFIDENTIALITY AGREEMENT')}${paper(`<div class="document-head"><div><p class="eyebrow">PERSONNEL CONFIDENTIALITY & INFORMATION SECURITY AGREEMENT</p><h1>塔工作人員保密及資訊安全協議書</h1><p class="muted">文件編號：TWR-HR-NDA-002 · 文件等級：內部使用</p></div><span class="stamp">NDA / 002</span></div><div class="nda-meta"><span>簽署人員 <b>${esc(s.employee)}</b></span><span>身份 <b>新進人員</b></span><span>職位 <b>待分配</b></span></div><p class="document-intro">本文件適用於正式啟用工作系統之新進人員。請閱讀以下全部條款並完成電子確認。<br><small>本文件是 HIRAETH 虛構世界內的模擬協議，不構成現實法律契約。</small></p><div class="nda-clauses" tabindex="0" aria-label="完整保密協議條款">${C.finalNda.map(a=>`<section class="clause"><h3>${esc(a.title)}</h3><p>${esc(a.body)}</p></section>`).join('')}</div><div class="signature"><p class="eyebrow">ELECTRONIC ACKNOWLEDGEMENT</p><label class="checkline"><input type="checkbox" id="nda-read" ${s.ndaRead?'checked':''}><span>我已完整閱讀上述十二條保密及資訊安全協議。</span></label><label class="checkline"><input type="checkbox" id="nda-agree" ${s.ndaAgree?'checked':''}><span>我理解並同意遵守上述條款及正式工作規範。</span></label><div class="formfield"><label for="signature-id">電子簽署確認 <small>請輸入您的工號 ${esc(s.employee)}</small></label><input id="signature-id" autocomplete="off" placeholder="${esc(s.employee)}" maxlength="20" spellcheck="false"></div><p id="signature-status" class="hint">請勾選兩項聲明並輸入工號。</p></div><div class="actions">${btn('返回測驗','back-quiz','secondary')}${btn('簽署協議並提交 →','sign-nda','primary',true)}</div>`,'document')}</main>`}
function checklist(){return `<main class="document-stage">${breadcrumbs('FINAL VERIFICATION')}${paper(`<p class="eyebrow">PERSONNEL ORIENTATION / FINAL CHECKLIST</p><h1>入職作業完成確認</h1><p class="muted">工號 ${esc(s.employee)} · 下列事項由系統依實際進度自動勾選。</p><div class="checklist">${[...C.modules.map((m,i)=>[String(i+1).padStart(2,'0')+' · '+m.title,s.completed.includes(m.id)]),['綜合入職測驗',s.examPassed],['最終保密協議',s.ndaSigned]].map(([title,ok])=>`<div class="checkitem">${readIcon(ok)}<strong>${esc(title)}</strong><span class="item-state">${ok?'已完成':'待完成'}</span></div>`).join('')}</div><div class="result-notice"><span>員工工號</span><strong>${esc(s.employee)}</strong><span>工作系統存取</span><strong>可以啟用</strong><span>職務分配</span><strong>待通知</strong></div><div class="actions">${btn('查看保密協議','view-final-nda','secondary')}${btn('完成入職程序 →','finish-checklist','primary',!(all()&&s.examPassed&&s.ndaSigned))}</div>`,'document')}</main>`}
function ready(){return `<main class="centerstage ready"><div class="big-check">✓</div><p class="eyebrow">ONBOARDING COMPLETED SUCCESSFULLY</p><h1>恭喜您，${esc(s.employee)}！</h1><p class="muted">您已完成所有新進人員共同培訓與必要確認。<br>您的基礎工作環境已經準備就緒。</p>${paper(`<div class="ready-data"><span>新人導覽</span><strong>7 / 7 · 完成</strong><span>綜合測驗</span><strong>PASS · ${s.examScore}/10</strong><span>最終保密協議</span><strong>SIGNED</strong><span>職務狀態</span><strong>待分配</strong><span>工作系統</span><strong>READY</strong></div><p class="ready-note">祝您第一個工作日順利。</p>${btn('進入工作系統 →','start-work')}`,'authpaper')}</main>`}
function leakView(){let l=C.leak[s.leakIndex]||C.leak[0];return `<p class="eyebrow red">UNVERIFIED EXTERNAL RECORDS / SPOILERS</p><h2>手冊之外的紀錄</h2><p class="subtle">以下為官方文件未收錄的外部敘事與資料。請自行決定是否閱讀。</p><div class="leak-tabs">${C.leak.map((x,i)=>`<button class="tab ${s.leakIndex===i?'current':''}" data-leak="${i}">${esc(x.tag)}</button>`).join('')}</div><article class="leak-paper"><p class="eyebrow">RECOVERED FILE ${String(s.leakIndex+1).padStart(3,'0')}</p><h3>${esc(l.title)}</h3><p>${esc(l.text)}</p><small>${esc(l.foot)}</small></article>${btn('返回工作桌面','close-window','secondary')}`}
function appWindow(){let content='',item=C.tour.find(a=>a.app===win);if(win==='external')content=leakView();else if(win==='profile')content=`<h2>個人資料</h2><dl class="profile"><dt>工號</dt><dd>${esc(s.employee)}</dd><dt>顯示名稱</dt><dd>${esc(s.name||'新進同仁')}</dd><dt>職務分配</dt><dd>待通知</dd><dt>共同培訓</dt><dd>已完成</dd></dl>`;else if(win==='inbox')content='<h2>內部郵件</h2><div class="mail"><b>PERSONNEL SYSTEM</b><span>您已完成入職培訓，請留意後續職務分配通知。</span></div><div class="mail"><b>INFORMATION SECURITY</b><span>請遵循工作終端機資訊安全規範。</span></div>';else if(win==='docs')content='<h2>工作文件</h2><p>您目前可以查閱基礎工作說明。其他文件請等待正式職務授權。</p>';else if(win==='calendar')content='<h2>工作日程</h2><p>目前尚無正式工作任務。請留意未來的安排通知。</p>';else if(win==='directory')content='<h2>人員名錄</h2><p>內部人員基本資料的詳細公開範圍仍在編輯中。您可以於日後的版本探索 Φ 小隊與其他人物介紹。</p>';else content=`<h2>${esc(item?.title||'工作應用')}</h2>`;
return `<div class="window-scrim"><section class="os-window ${win==='external'?'external':''}" role="dialog" aria-modal="true" aria-label="工作應用視窗"><header class="windowbar"><span>${win==='external'?'EXTERNAL ARCHIVE / UNVERIFIED':'THE TOWER / WORKSPACE'}</span><button data-action="close-window" aria-label="關閉視窗">×</button></header><div class="windowbody">${content}</div></section></div>`}
function hack(){return `<div class="hack-overlay"><section class="hack-window" role="dialog" aria-modal="true" aria-label="未知外部連線"><header><span>⌁　EXTERNAL SESSION DETECTED</span><span>— □ ×</span></header><div class="hack-content"><p class="terminal-line">&gt; SESSION ORIGIN: UNKNOWN</p><p class="terminal-line">&gt; ROUTING … CONNECTED</p><h2>……新來的？</h2><p>看來你已經完成了所有培訓。</p><p>他們教會你如何成為一名合格的員工。</p><p>不過，有幾頁東西似乎沒有放進新人手冊。</p><p class="terminal-line">ATTACHMENTS: 04 / UNVERIFIED RECORDS</p><div class="hack-actions">${btn('檢視外部紀錄 →','accept-hack','alert')}${btn('暫時關閉','reject-hack','ghost-light')}</div></div></section></div>`}
function desktop(){return `${W.render(s,ws,C)}${hackOpen?hack():''}`}
function render(){ROOT.innerHTML=`<div class="shell">${header()}${s.phase==='login'?login():s.phase==='terms'?terms():s.phase==='training'?training():s.phase==='tour'?tour():s.phase==='quiz'?quiz():s.phase==='finalnda'?finalNda():s.phase==='checklist'?checklist():s.phase==='ready'?ready():desktop()}${footer()}${portalUI()}</div>`;document.title=`${esc(stepLabel[s.phase])} | THE TOWER`;if(s.phase==='finalnda')validateSignature()}
function enterModule(i){if(i<0||i>=C.modules.length)return;if(i>0&&!s.completed.includes(C.modules[i-1].id))return;if(i===6){set({module:i,phase:'tour'});return}set({module:i,page:0,ack:false,phase:'training'})}
function finishModule(){let m=C.modules[s.module];if(!m||m.id==='workstation')return;let visitOK=m.id!=='welcome'||(s.visited.government&&s.visited.tower);if(!s.completed.includes(m.id)&&(!s.ack||!visitOK||s.page!==m.sections.length-1))return;let completed=[...new Set([...s.completed,m.id])],next=s.module+1;if(next===6)set({completed,module:6,tourStep:0,phase:'tour',ack:false});else if(next<C.modules.length)set({completed,module:next,page:0,ack:false});else set({completed,phase:'quiz'})}
function validateSignature(){const box=document.getElementById('signature-id'),button=document.querySelector('[data-action="sign-nda"]');if(!button||!box)return;let match=box.value.trim().toUpperCase()===s.employee;button.disabled=!(match&&s.ndaRead&&s.ndaAgree);let label=document.getElementById('signature-status');if(label)label.textContent=match?'工號已核對。請確認兩項聲明。':'請輸入與登入相同的員工工號完成確認。'}
ROOT.addEventListener('input',e=>{let el=e.target;if(el.dataset.wsSearch){let name=el.dataset.wsSearch,id=el.dataset.wsSearch,caret=el.selectionStart||0;ws[name+'Search']=el.value;ws.motion='none';render();let field=ROOT.querySelector('[data-ws-search="'+id+'"]');if(field){field.focus();field.setSelectionRange?.(caret,caret);}return;}if(el.dataset.wsSetting){s.wsReduceMotion=el.checked;store();render();return;}if(el.id==='initial-agree'){s.initialTerms=el.checked;store();let b=ROOT.querySelector('[data-action="accept-terms"]');if(b)b.disabled=!s.initialTerms;}if(el.id==='ack'){s.ack=el.checked;store();let b=ROOT.querySelector('[data-action="finish-module"]');if(b)b.disabled=!(s.ack&&(s.module!==0||(s.visited.government&&s.visited.tower)))}if(el.name?.match(/^q\d+$/)){s.answers[Number(el.name.slice(1))]=Number(el.value);store();let count=Object.keys(s.answers).filter(k=>s.answers[k]!==undefined).length;let c=ROOT.querySelector('#answer-count');if(c)c.textContent=count;let b=ROOT.querySelector('[data-action="submit-quiz"]');if(b)b.disabled=count<10;}if(el.id==='nda-read'){s.ndaRead=el.checked;store();validateSignature()}if(el.id==='nda-agree'){s.ndaAgree=el.checked;store();validateSignature()}if(el.id==='signature-id')validateSignature()});
ROOT.addEventListener('click',e=>{let el=e.target.closest('[data-action],[data-module],[data-portal],[data-portal-page],[data-window],[data-leak],[data-ws-action],[data-ws-mail],[data-ws-doc],[data-ws-person],[data-ws-tab],[data-ws-category],[data-ws-site],[data-ws-site-tab],[data-ws-leak],[data-ws-link],[data-ws-clear-read]');if(!el)return;if(s.phase==='desktop'&&W.click(el,s,ws,C,store,render))return;if(el.dataset.module!==undefined){enterModule(Number(el.dataset.module));return}if(el.dataset.portal!==undefined){portal=el.dataset.portal;portalPage=0;s.visited[portal]=true;store();render();return}if(el.dataset.portalPage!==undefined){portalPage=Number(el.dataset.portalPage);render();return}if(el.dataset.leak!==undefined){set({leakIndex:Number(el.dataset.leak)},false);return}if(el.dataset.window!==undefined){if(s.phase==='tour')return;W.open(ws,el.dataset.window);render();return}switch(el.dataset.action){
case 'preview-work':{let id=document.getElementById('employee')?.value.trim().toUpperCase()||'Q008',name=document.getElementById('nickname')?.value.trim()||'';if(!/^[A-Z0-9-]{2,20}$/.test(id)){document.getElementById('login-error').textContent='請輸入有效工號。';return;}hackOpen=false;ws=W.initial();W.open(ws,'inbox');set({employee:id,name,phase:'desktop',demoMode:true,breach:true});break;}
case 'login':{let id=document.getElementById('employee')?.value.trim().toUpperCase()||'',name=document.getElementById('nickname')?.value.trim()||'';if(!/^[A-Z0-9-]{2,20}$/.test(id)){document.getElementById('login-error').textContent='請輸入 2–20 位英文字母、數字或連字號。';return}set({employee:id,name,phase:s.initialTerms?'training':'terms'});break}
case 'back-login':set({phase:'login'});break;
case 'accept-terms':if(s.initialTerms)set({phase:'training',module:0,page:0});break;
case 'prev-page':if(s.page>0)set({page:s.page-1,ack:false});break;
case 'next-page':set({page:Math.min(s.page+1,C.modules[s.module].sections.length-1),ack:false});break;
case 'finish-module':finishModule();break;
case 'close-portal':portal=null;render();break;
case 'tour-back':if(s.tourStep>0)set({tourStep:s.tourStep-1},false);break;
case 'tour-next':if(s.tourStep===4)set({completed:[...new Set([...s.completed,'workstation'])],phase:'quiz'},true);else set({tourStep:s.tourStep+1},false);break;
case 'return-training':set({phase:'training',module:0,page:0});break;
case 'submit-quiz':{if(Object.keys(s.answers).filter(k=>s.answers[k]!==undefined).length<10)return;let score=C.questions.reduce((n,q,i)=>n+(s.answers[i]===q.correct?1:0),0);set({examScore:score,examPassed:score>=8},false);ROOT.querySelector('.score')?.scrollIntoView({behavior:'smooth',block:'center'});break}
case 'retry-quiz':set({answers:{},examScore:null,examPassed:false});break;
case 'to-final-nda':if(s.examPassed)set({phase:'finalnda'});break;
case 'back-quiz':set({phase:'quiz'});break;
case 'sign-nda':{let valid=document.getElementById('signature-id')?.value.trim().toUpperCase()===s.employee;if(s.ndaRead&&s.ndaAgree&&valid)set({ndaSigned:true,phase:'checklist'});break}
case 'view-final-nda':set({phase:'finalnda'});break;
case 'finish-checklist':if(all()&&s.examPassed&&s.ndaSigned)set({phase:'ready'});break;
case 'start-work':hackOpen=!s.breach;ws=W.initial();set({phase:'desktop',demoMode:false});break;
case 'accept-hack':hackOpen=false;W.open(ws,'external');set({breach:true,leakIndex:0},false);break;
case 'reject-hack':hackOpen=false;W.open(ws,'inbox');set({breach:true},false);break;
case 'close-window':win=null;render();break;
case 'reset':if(confirm('確定要清除目前試玩版的進度並重新開始嗎？（不會刪除 V2.2 網站的進度）')){s=fresh();ws=W.initial();win=null;portal=null;hackOpen=false;store();render();window.scrollTo(0,0)}break;
}});
ROOT.addEventListener('pointerdown',e=>{if(s.phase!=='desktop')return;let id=e.target.closest('[data-ws-window]')?.dataset.wsWindow;if(!id)return;if(!W.startDrag(e,ROOT,ws)){W.focus(ws,id);let node=e.target.closest('.ws-window');if(node)node.style.zIndex=ws.positions[id].z;}});
ROOT.addEventListener('keydown',e=>{if(s.phase==='desktop'&&!hackOpen&&e.key==='Escape'&&!e.target.closest('input,textarea,select')){e.preventDefault();W.back(ws);render();}});
render();
})();

</script>
</body>
</html>
