
<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#152433">

  <title>THE TOWER | Personnel Workstation</title>

  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/workstation.css">

  <style>
    #loading-error {
      display: none;
      min-height: 100vh;
      background: #152433;
      color: #e5edf2;
      padding: 60px 24px;
      font-family: system-ui, sans-serif;
    }

    #loading-error h1 {
      color: #d9c49c;
    }

    #loading-error pre {
      padding: 20px;
      background: #243b50;
      border-radius: 8px;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }
  </style>
</head>

<body>
  <div id="app" aria-live="polite"></div>

  <div id="loading-error">
    <h1>THE TOWER · SYSTEM ERROR</h1>
    <p>工作終端機無法啟動。</p>
    <p>請檢查以下檔案：</p>
    <pre id="error-details"></pre>
  </div>

  <script>
    const files = [
      "content/training.js",
      "content/workstation.js",
      "js/workstation.js",
      "js/app.js"
    ];

    function showError(message) {
      document.getElementById("app").style.display = "none";
      document.getElementById("loading-error").style.display = "block";
      document.getElementById("error-details").textContent = message;
    }

    window.addEventListener("error", function(event) {
      if (event.message && event.filename) {
        showError(
          "JavaScript 執行錯誤：\n" +
          event.message + "\n" +
          event.filename
        );
      }
    });

    function loadScript(index) {
      if (index >= files.length) {
        setTimeout(function() {
          const app = document.getElementById("app");
          if (!app || !app.innerHTML.trim()) {
            showError("程式已載入，但工作畫面未成功建立。");
          }
        }, 1000);
        return;
      }

      const script = document.createElement("script");
      script.src = files[index];

      script.onload = function() {
        loadScript(index + 1);
      };

      script.onerror = function() {
        showError(
          "找不到必要檔案：\n" +
          files[index] +
          "\n\n請確認 GitHub 的資料夾位置。"
        );
      };

      document.body.appendChild(script);
    }

    loadScript(0);
  </script>
</body>
</html>
